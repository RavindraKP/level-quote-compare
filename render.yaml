# Render Blueprint: one web service from the Dockerfile, with a persistent disk.
# Secrets (key, passcode) are marked sync: false, so Render asks for them in the dashboard.
services:
  - type: web
    name: level
    runtime: docker
    plan: starter            # a persistent disk needs a paid instance; free instances have none
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    numInstances: 1          # exactly one process: it owns the worker thread and the SQLite file
    autoDeploy: true
    disk:
      name: level-data
      mountPath: /var/level
      sizeGB: 1
    envVars:
      - key: LEVEL_ANTHROPIC_API_KEY
        sync: false
      - key: LEVEL_PASSCODE
        sync: false
      - key: LEVEL_MODEL
        value: claude-haiku-5-5
      - key: LEVEL_DB_PATH
        value: /var/level/level.db
      - key: LEVEL_UPLOAD_DIR
        value: /var/level/uploads
